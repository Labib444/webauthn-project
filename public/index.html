<!DOCTYPE html>
<html>
<head>
  <title>WebAuthn Login System</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 100px;
    }

    input {
      padding: 10px;
      margin: 10px;
    }

    button {
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
    }

    .box {
      border: 1px solid #ddd;
      display: inline-block;
      padding: 30px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Passwordless Login (WebAuthn)</h2>

  <input id="username" placeholder="Enter username" />

  <br/>

  <button id="registerBtn">Register</button>
  <button id="loginBtn">Login</button>
</div>

<script type="module" src="./app.js"></script>

</body>
</html>
