<!DOCTYPE html>
<html>
<head>
  <title>WebAuthn Login System</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial;

      margin: 0;
      padding: 20px;

      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      border: 1px solid #ddd;

      border-radius: 10px;

      padding: 30px;

      width: 100%;
      max-width: 400px;

      text-align: center;
    }

    input {
      width: 100%;

      padding: 10px;

      margin-top: 10px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;

      padding: 10px;

      margin-top: 8px;

      cursor: pointer;
    }

    @media (max-width: 480px) {
      .box {
        padding: 20px;
      }

      h2 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="box">

    <h2>Passwordless Login (WebAuthn)</h2>

    <input
      id="username"
      placeholder="Enter username"
    />

    <button id="registerBtn">
      Register
    </button>

    <button id="loginBtn">
      Login
    </button>

  </div>

  <script type="module" src="./app.js"></script>

</body>
</html>
